services:
  postgres:
    image: postgres:16-alpine
    container_name: shared-budget-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: shared_budget
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d shared_budget"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
